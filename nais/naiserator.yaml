kind: Application
apiVersion: nais.io/v1alpha1
metadata:
  name: {{ APP_NAME }}
  namespace: teamdokumenthandtering
  labels:
    team: teamdokumenthandtering
spec:
  env:
    - name: JAVA_TRUSTSTORE_OPTIONS
      value: "-Djavax.net.ssl.trustStore=$(NAV_TRUSTSTORE_PATH)
              -Djavax.net.ssl.trustStorePassword=$(NAV_TRUSTSTORE_PASSWORD)"
    - name: JDK_JAVA_OPTIONS
      value: "-XX:MaxRAMPercentage=75
              $(JAVA_PROXY_OPTIONS) $(JAVA_TRUSTSTORE_OPTIONS)"
    - name: DOKDISTADMIN_DATABASE_SCHEMA
      value: {{ DOKDISTADMIN_DATABASE_SCHEMA }}
    - name: DOKDISTADMIN_MODUS
      value: {{ DOKDISTADMIN_MODUS }}
    - name: OTEL_RESOURCE_ATTRIBUTES
      value: "deployment.environment.name={{ ENVIRONMENT }}"
    - name: DOKDISTADMIN_JMS_BROKER_HOSTNAME
      value: {{ DOKDISTADMIN_JMS_BROKER_HOSTNAME }}
    - name: DOKDISTADMIN_JMS_BROKER_PORT
      value: "{{ DOKDISTADMIN_JMS_BROKER_PORT }}"
    - name: DOKDISTADMIN_JMS_BROKER_NAME
      value: {{ DOKDISTADMIN_JMS_BROKER_NAME }}
    - name: DOKDISTADMIN_JMS_BROKER_CHANNEL
      value: {{ DOKDISTADMIN_JMS_BROKER_CHANNEL }}
    - name: DOKDISTADMIN_JMS_QUEUES_QDIST009_PRINT
      value: {{ DOKDISTADMIN_JMS_QUEUES_QDIST009_PRINT }}
    - name: DOKDISTADMIN_JMS_QUEUES_QDIST010_DITTNAV
      value: {{ DOKDISTADMIN_JMS_QUEUES_QDIST010_DITTNAV }}
    - name: DOKDISTADMIN_JMS_QUEUES_QDIST011_SDP
      value: {{ DOKDISTADMIN_JMS_QUEUES_QDIST011_SDP }}
    - name: DOKDISTADMIN_JMS_QUEUES_QDIST016_DPVT
      value: {{ DOKDISTADMIN_JMS_QUEUES_QDIST016_DPVT }}
  image: {{ image }}
  ingresses:
    {{#each INGRESSES}}
       - {{this }}
      {{/each}}
  liveness:
    path: /actuator/health/liveness
    port: 8080
    initialDelay: 30
    failureThreshold: 10
  port: 8080
  prometheus:
    enabled: true
    path: /actuator/prometheus
  readiness:
    path: /actuator/health/readiness
    port: 8080
    initialDelay: 30
    timeout: 3
  replicas:
    min: {{ MIN_REPLICAS }}
    max: {{ MAX_REPLICAS }}
    cpuThresholdPercentage: 75
  resources:
    limits:
      memory: 2Gi
    requests:
      cpu: 30m
      memory: 1Gi
  envFrom:
    - secret: {{DOKDISTADMIN_SECRET}}
  webproxy: true
  observability:
    autoInstrumentation:
      enabled: true
      runtime: java
      destinations:
        - id: "elastic-apm"
    logging:
      destinations:
        - id: elastic
  azure:
    application:
      enabled: true
      claims:
        extra:
          - "azp_name"
  accessPolicy:
    inbound:
      rules:
    {{#each AZURE_IAC_RULES}}
       - application: {{app}}
         namespace: {{namespace}}
         cluster: {{cluster}}
    {{/each}}
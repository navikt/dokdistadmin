# Azure-mock
no.nav.security.jwt.issuer.azurev2.discoveryUrl=http://localhost:${mock-oauth2-server.port}/azurev2/.well-known/openid-configuration
no.nav.security.jwt.issuer.azurev2.acceptedAudience=gosys

dokdistadmin.modus=T

spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.OracleDialect
spring.jpa.properties.hibernate.generate_statistics=false
spring.jpa.properties.hibernate.show_sql=false
spring.jackson.deserialization.fail-on-unknown-properties=false

# flyway configuration
spring.flyway.enabled=false
spring.autoconfigure.exclude=org.springframework.boot.autoconfigure.flyway.FlywayAutoConfiguration